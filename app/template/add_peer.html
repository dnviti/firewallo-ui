<!-- templates/add_peer.html -->
{% extends "base.html" %}
{% block content %}
<h2>Add New Peer</h2>
<form action="/add_peer" method="post">
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required><br><br>
    <label for="server_interface">Server Interface:</label>
    <select id="server_interface" name="server_interface" required>
        {% for server in servers %}
            <option value="{{ server.interface }}">{{ server.interface }}</option>
        {% endfor %}
    </select><br><br>
    <label for="allowed_ips">Allowed IPs:</label>
    <input type="text" id="allowed_ips" name="allowed_ips" required><br><br>
    <label for="endpoint">Endpoint (optional):</label>
    <input type="text" id="endpoint" name="endpoint"><br><br>
    <label for="group">Group (optional):</label>
    <input type="text" id="group" name="group"><br><br>
    <label for="persistent_keepalive">Persistent Keepalive (optional):</label>
    <input type="number" id="persistent_keepalive" name="persistent_keepalive"><br><br>
    <input type="submit" value="Add Peer">
</form>
{% endblock %}
