<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Firewallo Login</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    body { background: radial-gradient(circle at 20% 20%, #0d1117, #0a0f14 60%, #05070a); color:#e6edf3; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif; }
    .login-wrapper { width:100%; max-width:440px; padding:2.5rem 2.25rem 2.75rem; background:#111922e6; backdrop-filter:blur(14px); border:1px solid #22313f; border-radius:18px; box-shadow:0 18px 42px -12px rgba(0,0,0,.65),0 0 0 1px #1c2732 inset; }
    h1 { font-size:1.45rem; font-weight:600; letter-spacing:.5px; margin-bottom:.25rem; }
    .lead { font-size:.8rem; color:#9aa4b1; margin-bottom:1.5rem; }
    label span { text-transform:uppercase; letter-spacing:.5px; font-size:.65rem; font-weight:600; color:#7d8894; }
    .form-control { background:#10161d; border:1px solid #293541; color:#e6edf3; }
    .form-control:focus { border-color:#2d81ff; box-shadow:0 0 0 .2rem #2d81ff33; }
    .btn-primary { background:linear-gradient(90deg,#2d81ff,#6aa8ff); border:none; font-weight:600; letter-spacing:.5px; }
    .btn-primary:hover { filter:brightness(1.08); }
    .status-msg { font-size:.7rem; text-transform:uppercase; letter-spacing:.6px; font-weight:600; padding:.55rem .65rem; border-radius:8px; }
    .status-error { background:#381b22; color:#ff8086; border:1px solid #ff4d5a33; }
    .footer-note { margin-top:2rem; font-size:.65rem; text-align:center; color:#65707c; }
    .shortcut-hint kbd { background:#1f2733; border:1px solid #2e3945; padding:2px 6px; border-radius:6px; font-size:.65rem; font-weight:500; }
  </style>
</head>
<body>
  <div class="login-wrapper" data-component="login-card">
    <h1>Firewallo</h1>
    <p class="lead mb-4">Secure WireGuard management. Sign in to manage servers & peers.</p>
    <div id="error-box" class="mb-3" style="display:none"></div>
    <form id="login-form" autocomplete="on">
      <div class="mb-3">
        <label class="form-label w-100"><span>Username</span>
          <input id="username" name="username" class="form-control form-control-lg" required autofocus autocomplete="username" />
        </label>
      </div>
      <div class="mb-2">
        <label class="form-label w-100"><span>Password</span>
          <input id="password" type="password" name="password" class="form-control form-control-lg" required autocomplete="current-password" />
        </label>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" value="1" id="remember" />
          <label class="form-check-label" for="remember">Remember</label>
        </div>
        <div class="shortcut-hint text-secondary">Press <kbd>Enter</kbd> to login</div>
      </div>
      <button id="login-btn" type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
    </form>
    <div class="footer-note">© <span id="year"></span> Firewallo • Optimized for IT operations speed</div>
  </div>
  <script>
    (function(){
      document.getElementById('year').textContent = new Date().getFullYear();
      const form = document.getElementById('login-form');
      const btn = document.getElementById('login-btn');
      const errorBox = document.getElementById('error-box');
      async function login(username, password){
        const fd = new FormData();
        fd.append('username', username); fd.append('password', password);
        const res = await fetch('/api/auth/jwt/login', { method:'POST', body: fd });
        if(!res.ok){
          let detail = 'Login failed';
          try { const j = await res.json(); detail = j.detail || detail; } catch {}
          throw new Error(detail);
        }
        const token = res.headers.get('Authorization')?.replace('Bearer ', '') || (await res.text());
        if(!token) throw new Error('Token missing');
        localStorage.setItem('jwt', token);
      }
      form.addEventListener('submit', async (e)=>{
        e.preventDefault(); errorBox.style.display='none'; btn.disabled = true; const u = username.value.trim(); const p = password.value;
        btn.textContent = 'Authenticating…';
        const started = performance.now();
        try {
          await login(u,p);
          const elapsed = performance.now() - started;
          const minDelay = 350; if (elapsed < minDelay) await new Promise(r=>setTimeout(r, minDelay - elapsed));
          window.location.href = '/plugins/wireguard/peers';
        } catch(err){
          errorBox.className='status-msg status-error';
            errorBox.textContent = err.message;
            errorBox.style.display='block';
        } finally {
          btn.disabled=false; btn.textContent='Login';
        }
      });
      try { if(localStorage.getItem('jwt')) { window.location.replace('/plugins/wireguard/peers'); } } catch {}
    })();
  </script>
</body>
</html>
