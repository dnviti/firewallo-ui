<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Firewallo</title>
        <!-- Bootstrap 5 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <!-- Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <style>
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            .login-container {
                max-width: 400px;
                margin: 0 auto;
                padding: 20px;
            }

            .login-card {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 15px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                padding: 40px;
            }

            .login-header {
                text-align: center;
                margin-bottom: 30px;
            }

            .login-logo {
                width: 80px;
                height: 80px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 20px;
                font-size: 2rem;
                color: white;
                box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            }

            .login-title {
                color: #333;
                font-weight: 600;
                margin-bottom: 8px;
            }

            .login-subtitle {
                color: #666;
                font-size: 0.9rem;
            }

            .form-floating {
                margin-bottom: 20px;
            }

            .form-control {
                border-radius: 8px;
                border: 2px solid #e1e5e9;
                padding: 12px 16px;
                height: auto;
                font-size: 0.95rem;
            }

            .form-control:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

            .form-floating > label {
                padding: 1rem 1rem;
                font-weight: 500;
            }

            .btn-login {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                border-radius: 8px;
                padding: 12px 24px;
                font-weight: 600;
                font-size: 1rem;
                width: 100%;
                color: white;
                transition: all 0.3s ease;
                margin-bottom: 20px;
            }

            .btn-login:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
                color: white;
            }

            .btn-login:disabled {
                opacity: 0.7;
                transform: none;
                box-shadow: none;
            }

            .form-check {
                margin-bottom: 20px;
            }

            .form-check-input:checked {
                background-color: #667eea;
                border-color: #667eea;
            }

            .form-check-input:focus {
                box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
            }

            .alert {
                border-radius: 8px;
                margin-bottom: 20px;
                font-size: 0.9rem;
            }

            .forgot-password {
                text-align: center;
            }

            .forgot-password a {
                color: #667eea;
                text-decoration: none;
                font-size: 0.9rem;
            }

            .forgot-password a:hover {
                text-decoration: underline;
            }

            .loading-spinner {
                display: none;
            }

            @media (max-width: 576px) {
                .login-card {
                    margin: 20px;
                    padding: 30px 25px;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <div class="login-logo">
                            <i class="bi bi-shield-check"></i>
                        </div>
                        <h2 class="login-title">Welcome Back</h2>
                        <p class="login-subtitle">
                            Please sign in with your username and password
                        </p>
                    </div>

                    <!-- Error/Success Messages -->
                    <div id="message-container"></div>

                    <form id="login-form">
                        <div class="form-floating">
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                placeholder="Username"
                                required
                                autocomplete="username"
                            />
                            <label for="username">
                                <i class="bi bi-person me-2"></i>Username
                            </label>
                        </div>

                        <div class="form-floating">
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Password"
                                required
                                autocomplete="current-password"
                            />
                            <label for="password">
                                <i class="bi bi-lock me-2"></i>Password
                            </label>
                        </div>

                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember-me"
                                checked
                            />
                            <label class="form-check-label" for="remember-me">
                                Remember me for 30 days
                            </label>
                        </div>

                        <button
                            class="btn btn-login"
                            type="submit"
                            id="login-btn"
                        >
                            <span class="login-text">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Sign In
                            </span>
                            <span class="loading-spinner">
                                <span
                                    class="spinner-border spinner-border-sm me-2"
                                    role="status"
                                    aria-hidden="true"
                                ></span>
                                Signing in...
                            </span>
                        </button>

                        <div class="forgot-password">
                            <a href="#" id="forgot-password-link"
                                >Forgot your password?</a
                            >
                        </div>
                    </form>
                </div>

                <!-- System Status Footer -->
                <div class="text-center mt-3">
                    <small class="text-white-50">
                        <i class="bi bi-shield-check me-1"></i>
                        Firewallo System Status:
                        <span class="text-success">Online</span>
                    </small>
                </div>
            </div>
        </div>

        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                // Get form elements
                const loginForm = document.getElementById("login-form");
                const usernameInput = document.getElementById("username");
                const passwordInput = document.getElementById("password");
                const rememberMeInput = document.getElementById("remember-me");
                const submitButton = document.getElementById("login-btn");
                const loginText = submitButton.querySelector(".login-text");
                const loadingSpinner =
                    submitButton.querySelector(".loading-spinner");
                const messageContainer =
                    document.getElementById("message-container");

                // Simple validation
                function validateInput() {
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;

                    if (!username) {
                        showMessage("Please enter your username", "danger");
                        usernameInput.focus();
                        return false;
                    }

                    if (username.length < 3) {
                        showMessage(
                            "Username must be at least 3 characters",
                            "danger",
                        );
                        usernameInput.focus();
                        return false;
                    }

                    if (!password) {
                        showMessage("Please enter your password", "danger");
                        passwordInput.focus();
                        return false;
                    }

                    if (password.length < 3) {
                        showMessage(
                            "Password must be at least 3 characters",
                            "danger",
                        );
                        passwordInput.focus();
                        return false;
                    }

                    return true;
                }

                // Show messages to user
                function showMessage(message, type) {
                    const alertDiv = document.createElement("div");
                    alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                    alertDiv.innerHTML = `
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    `;

                    messageContainer.innerHTML = "";
                    messageContainer.appendChild(alertDiv);

                    // Auto-dismiss success messages
                    if (type === "success") {
                        setTimeout(() => {
                            if (alertDiv.parentNode) {
                                alertDiv.remove();
                            }
                        }, 3000);
                    }
                }

                // Set loading state
                function setLoadingState(loading) {
                    submitButton.disabled = loading;
                    loginText.style.display = loading ? "none" : "inline";
                    loadingSpinner.style.display = loading ? "inline" : "none";

                    usernameInput.disabled = loading;
                    passwordInput.disabled = loading;
                    rememberMeInput.disabled = loading;
                }

                // Main login function
                async function performLogin() {
                    console.log("performLogin called");

                    // Validate input
                    if (!validateInput()) {
                        return;
                    }

                    // Get form values
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    const rememberMe = rememberMeInput.checked;

                    console.log("Login attempt:", {
                        username,
                        passwordLength: password.length,
                        rememberMe,
                    });

                    // Set loading state
                    setLoadingState(true);

                    try {
                        // Prepare OAuth2 form data
                        console.log("Sending login request...");

                        const formData = new FormData();
                        formData.append("username", username);
                        formData.append("password", password);
                        formData.append("grant_type", "password");

                        // Make login request to standard endpoint
                        const response = await fetch("/api/auth/login", {
                            method: "POST",
                            body: formData,
                            credentials: "include",
                        });

                        console.log("Response status:", response.status);

                        if (response.ok) {
                            const result = await response.json();
                            console.log("Login successful:", result);

                            showMessage(
                                "Login successful! Redirecting...",
                                "success",
                            );

                            // Wait a moment then redirect
                            setTimeout(() => {
                                window.location.href = "/dashboard";
                            }, 1000);
                        } else {
                            // Handle login failure
                            let errorMessage =
                                "Login failed. Please check your credentials.";

                            try {
                                const errorData = await response.json();
                                if (errorData.detail) {
                                    errorMessage = errorData.detail;
                                }
                            } catch (e) {
                                console.log("Could not parse error response");
                            }

                            console.log("Login failed:", errorMessage);
                            showMessage(errorMessage, "danger");
                        }
                    } catch (error) {
                        console.error("Login error:", error);
                        showMessage(
                            "Network error. Please try again.",
                            "danger",
                        );
                    } finally {
                        setLoadingState(false);
                    }
                }

                // Form submit handler
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log("Form submitted");
                    performLogin();
                });

                // Enter key handlers
                usernameInput.addEventListener("keypress", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        performLogin();
                    }
                });

                passwordInput.addEventListener("keypress", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        performLogin();
                    }
                });

                // Forgot password handler
                document
                    .getElementById("forgot-password-link")
                    .addEventListener("click", function (e) {
                        e.preventDefault();
                        showMessage(
                            "Password reset functionality would be implemented here.",
                            "info",
                        );
                    });

                // Focus username field
                usernameInput.focus();

                console.log("Login form initialized");
            });
        </script>
    </body>
</html>
