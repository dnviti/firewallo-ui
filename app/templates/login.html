<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Firewallo UI</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 0 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 2rem;
            color: white;
        }

        .login-title {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #666;
            font-size: 0.9rem;
        }

        .form-floating {
            margin-bottom: 1rem;
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #e1e5e9;
            padding: 1rem 1rem;
            height: auto;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .form-floating > label {
            padding: 1rem 1rem;
            color: #666;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 1rem;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }

        .btn-login:disabled {
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        .form-check {
            margin: 1rem 0;
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        .form-check-input:focus {
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 1rem;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1.5rem;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: none;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 1.5rem;
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="bi bi-shield-check"></i>
                </div>
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-subtitle">Please sign in to your Firewallo account</p>
            </div>

            <!-- Error/Success Messages -->
            <div id="message-container"></div>

            <form id="login-form" novalidate>
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">
                        <i class="bi bi-envelope me-2"></i>Email Address
                    </label>
                    <div class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required minlength="6">
                    <label for="password">
                        <i class="bi bi-lock me-2"></i>Password
                    </label>
                    <div class="invalid-feedback">
                        Password must be at least 6 characters long.
                    </div>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="remember-me">
                    <label class="form-check-label" for="remember-me">
                        Remember me for 30 days
                    </label>
                </div>

                <button class="btn btn-login" type="submit">
                    <span class="login-text">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </span>
                    <span class="loading-spinner">
                        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        Signing in...
                    </span>
                </button>

                <div class="forgot-password">
                    <a href="#" id="forgot-password-link">Forgot your password?</a>
                </div>
            </form>
        </div>

        <!-- System Status Footer -->
        <div class="text-center mt-3">
            <small class="text-white-50">
                <i class="bi bi-shield-check me-1"></i>
                Firewallo System Status: <span class="text-success">Online</span>
            </small>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitButton = loginForm.querySelector('.btn-login');
            const loginText = submitButton.querySelector('.login-text');
            const loadingSpinner = submitButton.querySelector('.loading-spinner');

            // Form submission
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                e.stopPropagation();

                if (validateForm()) {
                    await attemptLogin();
                }

                loginForm.classList.add('was-validated');
            });

            // Real-time validation
            emailInput.addEventListener('input', function() {
                validateEmail();
            });

            passwordInput.addEventListener('input', function() {
                validatePassword();
            });

            // Forgot password functionality
            document.getElementById('forgot-password-link').addEventListener('click', function(e) {
                e.preventDefault();
                showMessage('Password reset functionality would be implemented here.', 'info');
            });

            function validateForm() {
                return validateEmail() && validatePassword();
            }

            function validateEmail() {
                const email = emailInput.value.trim();
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!email) {
                    emailInput.setCustomValidity('Email is required.');
                    return false;
                } else if (!emailPattern.test(email)) {
                    emailInput.setCustomValidity('Please enter a valid email address.');
                    return false;
                } else {
                    emailInput.setCustomValidity('');
                    return true;
                }
            }

            function validatePassword() {
                const password = passwordInput.value;

                if (!password) {
                    passwordInput.setCustomValidity('Password is required.');
                    return false;
                } else if (password.length < 6) {
                    passwordInput.setCustomValidity('Password must be at least 6 characters long.');
                    return false;
                } else {
                    passwordInput.setCustomValidity('');
                    return true;
                }
            }

            async function attemptLogin() {
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const rememberMe = document.getElementById('remember-me').checked;

                // Show loading state
                setLoadingState(true);

                try {
                    const formData = new FormData();
                    formData.append('username', email);
                    formData.append('password', password);

                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'
                    });

                    if (response.ok) {
                        const result = await response.json();
                        showMessage('Login successful! Redirecting...', 'success');

                        // Store token if remember me is checked
                        if (rememberMe && result.access_token) {
                            localStorage.setItem('access_token', result.access_token);
                        }

                        // Redirect after short delay
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1500);
                    } else {
                        const error = await response.json();
                        showMessage(error.detail || 'Login failed. Please check your credentials.', 'danger');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showMessage('Network error. Please try again.', 'danger');
                } finally {
                    setLoadingState(false);
                }
            }

            function setLoadingState(loading) {
                submitButton.disabled = loading;
                loginText.style.display = loading ? 'none' : 'inline';
                loadingSpinner.style.display = loading ? 'inline' : 'none';
            }

            function showMessage(message, type) {
                const messageContainer = document.getElementById('message-container');
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                `;

                // Clear previous messages
                messageContainer.innerHTML = '';
                messageContainer.appendChild(alertDiv);

                // Auto-dismiss success messages
                if (type === 'success') {
                    setTimeout(() => {
                        if (alertDiv.parentNode) {
                            bootstrap.Alert.getInstance(alertDiv)?.close();
                        }
                    }, 3000);
                }
            }

            // Handle enter key in password field
            passwordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });

            // Auto-focus email field
            emailInput.focus();
        });
    </script>
</body>
</html>
