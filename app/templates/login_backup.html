<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Firewallo UI</title>

        <!-- Bootstrap 5 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <!-- Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        />

        <style>
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }

            .login-container {
                max-width: 400px;
                width: 100%;
                padding: 0 20px;
            }

            .login-card {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(10px);
                border-radius: 20px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
                padding: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .login-header {
                text-align: center;
                margin-bottom: 2rem;
            }

            .login-logo {
                width: 80px;
                height: 80px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1rem;
                font-size: 2rem;
                color: white;
            }

            .login-title {
                color: #333;
                font-weight: 600;
                margin-bottom: 0.5rem;
            }

            .login-subtitle {
                color: #666;
                font-size: 0.9rem;
            }

            .form-floating {
                margin-bottom: 1rem;
            }

            .form-control {
                border-radius: 10px;
                border: 2px solid #e1e5e9;
                padding: 1rem 1rem;
                height: auto;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .form-control:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

            .form-floating > label {
                padding: 1rem 1rem;
                color: #666;
            }

            .btn-login {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                border: none;
                border-radius: 10px;
                padding: 1rem;
                font-weight: 600;
                font-size: 1rem;
                width: 100%;
                color: white;
                transition: all 0.3s ease;
                margin-top: 1rem;
            }

            .btn-login:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
                color: white;
            }

            .btn-login:disabled {
                transform: none;
                box-shadow: none;
                opacity: 0.7;
            }

            .form-check {
                margin: 1rem 0;
            }

            .form-check-input:checked {
                background-color: #667eea;
                border-color: #667eea;
            }

            .form-check-input:focus {
                box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            }

            .alert {
                border-radius: 10px;
                border: none;
                margin-bottom: 1rem;
            }

            .forgot-password {
                text-align: center;
                margin-top: 1.5rem;
            }

            .forgot-password a {
                color: #667eea;
                text-decoration: none;
                font-size: 0.9rem;
            }

            .forgot-password a:hover {
                text-decoration: underline;
            }

            .loading-spinner {
                display: none;
            }

            @media (max-width: 576px) {
                .login-card {
                    padding: 1.5rem;
                    margin: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h2 class="login-title">Welcome Back</h2>
                    <p class="login-subtitle">
                        Please sign in with your username and password
                    </p>
                </div>

                <!-- Error/Success Messages -->
                <div id="message-container"></div>

                <form id="login-form" novalidate>
                    <div class="form-floating">
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Username"
                            required
                        />
                        <label for="username">
                            <i class="bi bi-person me-2"></i>Username
                        </label>
                        <div class="invalid-feedback">
                            Please enter your username.
                        </div>
                    </div>

                    <div class="form-floating">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Password"
                            required
                            minlength="6"
                        />
                        <label for="password">
                            <i class="bi bi-lock me-2"></i>Password
                        </label>
                        <div class="invalid-feedback">
                            Password must be at least 6 characters long.
                        </div>
                    </div>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            value=""
                            id="remember-me"
                            checked
                        />
                        <label class="form-check-label" for="remember-me">
                            Remember me for 30 days
                        </label>
                    </div>

                    <button class="btn btn-login" type="submit">
                        <span class="login-text">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Sign In
                        </span>
                        <span class="loading-spinner">
                            <span
                                class="spinner-border spinner-border-sm me-2"
                                role="status"
                                aria-hidden="true"
                            ></span>
                            Signing in...
                        </span>
                    </button>

                    <div class="forgot-password">
                        <a href="#" id="forgot-password-link"
                            >Forgot your password?</a
                        >
                    </div>
                </form>
            </div>

            <!-- System Status Footer -->
            <div class="text-center mt-3">
                <small class="text-white-50">
                    <i class="bi bi-shield-check me-1"></i>
                    Firewallo System Status:
                    <span class="text-success">Online</span>
                </small>
            </div>
        </div>

        <!-- Bootstrap 5 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const loginForm = document.getElementById("login-form");
                const usernameInput = document.getElementById("username");
                const passwordInput = document.getElementById("password");
                const submitButton = loginForm.querySelector(".btn-login");
                const loginText = submitButton.querySelector(".login-text");
                const loadingSpinner = submitButton.querySelector(".loading-spinner");

                // Form submission handler
                loginForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    console.log("Form submit event triggered");
                    handleLogin();
                });

                // Main login handler
                async function handleLogin() {
                    console.log("handleLogin called");
                    
                    // Clear any previous validation
                    usernameInput.setCustomValidity("");
                    passwordInput.setCustomValidity("");
                    
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    const rememberMe = document.getElementById("remember-me").checked;

                    console.log("LoginattemptLogin called");
                    console.log("Username:", username);
                    console.log("Password length:", password.length);
                    console.log("Remember me:", rememberMe);

                    // Show loading state
                    setLoadingState(true);

                    try {
                        // Use enhanced login endpoint with JSON payload
                        const loginData = {
                            username: username,
                            password: password,
                            remember_me: rememberMe,
                        };

                        console.log("Sending login request:", loginData);

                        const response = await fetch(
                            "/api/auth/login-enhanced",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                },
                                body: JSON.stringify(loginData),
                                credentials: "include",
                            },
                        );

                        console.log("Response status:", response.status);
                        console.log("Response headers:", response.headers);

                        if (response.ok) {
                            const result = await response.json();
                            console.log("Login successful, result:", result);
                            showMessage(
                                "Login successful! Redirecting...",
                                "success",
                            );

                            // Session and token are automatically set as httpOnly cookies by the server
                            // No need to manually set cookies from JavaScript for security
                            console.log(
                                "Login successful, session established",
                            );

                            // Redirect after short delay
                            setTimeout(() => {
                                window.location.href = "/dashboard";
                            }, 1500);
                        } else {
                            const errorText = await response.text();
                            console.log("Login failed, response:", errorText);
                            let errorMessage =
                                "Login failed. Please check your credentials.";
                            try {
                                const error = JSON.parse(errorText);
                                errorMessage = error.detail || errorMessage;
                            } catch (e) {
                                console.log("Could not parse error as JSON");
                            }
                            showMessage(errorMessage, "danger");
                        }
                    } catch (error) {
                        console.error("Login error:", error);
                        showMessage(
                            "Network error. Please try again.",
                            "danger",
                        );
                    } finally {
                        setLoadingState(false);
                    }
                }

                function setLoadingState(loading) {
                    submitButton.disabled = loading;
                    loginText.style.display = loading ? "none" : "inline";
                    loadingSpinner.style.display = loading ? "inline" : "none";
                }

                function showMessage(message, type) {
                    const messageContainer =
                        document.getElementById("message-container");
                    const alertDiv = document.createElement("div");
                    alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                    alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                `;

                    // Clear previous messages
                    messageContainer.innerHTML = "";
                    messageContainer.appendChild(alertDiv);

                    // Auto-dismiss success messages
                    if (type === "success") {
                        setTimeout(() => {
                            if (alertDiv.parentNode) {
                                bootstrap.Alert.getInstance(alertDiv)?.close();
                            }
                        }, 3000);
                    }
                }

                // Handle enter key in password field
                passwordInput.addEventListener("keypress", async function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        await submitLoginForm();
                    }
                });

                // Handle enter key in username field
                usernameInput.addEventListener("keypress", async function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        await submitLoginForm();
                    }
                });

                // Auto-focus username field
                usernameInput.focus();
            });
        </script>
    </body>
</html>
