<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Firewallo UI</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- React + ReactDOM UMD (no build step) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone to transpile JSX in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <noscript>This application requires JavaScript.</noscript>
  <div id="app-root"></div>
  <!-- App code (JSX) -->
  <script type="text/babel" data-presets="env,react" src="/static/js/api.js"></script>
  <script type="text/babel" data-presets="env,react" src="/static/js/react-app.jsx"></script>
</body>
</html>
